name: O-KAM Native Lab
version: 0.0.6
slug: okam_native
description: ARM64 native-runtime acceptance app for O-KAM cameras
url: https://github.com/oleandor/okam-ha-native
image: ghcr.io/oleandor/okam-ha-native
arch:
  - aarch64
machine:
  - raspberrypi4-64
startup: application
boot: manual
stage: experimental
watchdog: http://[HOST]:[PORT:8099]/health
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Native runtime status API
options:
  account_username: null
  account_password: null
  camera_id: cabin
  run_connect_test: false
  run_auth_test: false
  run_stream_test: false
schema:
  account_username: email
  account_password: password
  camera_id: "match(^[A-Za-z0-9_-]{1,32}$)"
  run_connect_test: bool
  run_auth_test: bool
  run_stream_test: bool
