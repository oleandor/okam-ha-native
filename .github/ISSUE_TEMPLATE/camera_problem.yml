name: Camera problem
description: The bridge or the camera does not work as expected
body:
  - type: markdown
    attributes:
      value: |
        Please remove device IDs (UIDs), IP addresses, tokens and passwords
        from everything you paste here.
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      description: Settings → System → Repairs → System information → Architecture
      options:
        - aarch64
        - amd64
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera model
      description: As shown in the O-KAM app. Battery or mains powered?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: App log lines
      description: >-
        The native_loader_ready, account_enumerated, startup_ready,
        stream_starting and stream_ended lines from the app log.
      render: text
    validations:
      required: true
