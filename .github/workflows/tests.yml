name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  windows-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - run: i686-w64-mingw32-gcc -std=c11 -Wall -Wextra -Werror -static -o okam-windows-probe.exe native/windows_probe/p2p_probe.c
      - run: i686-w64-mingw32-gcc -std=c11 -Wall -Wextra -Werror -static -o okam-devdll-probe.exe native/windows_probe/devdll_probe.c -ladvapi32
      - run: i686-w64-mingw32-gcc -std=c11 -Wall -Wextra -Werror -static -o okam-stream-probe.exe native/windows_probe/stream_probe.c -ladvapi32
      - run: cc -std=c11 -Wall -Wextra -Werror -o okam-arm64-loader-probe native/arm64_probe/loader_probe.c -ldl
      - uses: actions/upload-artifact@v4
        with:
          name: okam-windows-probe
          path: |
            okam-windows-probe.exe
            okam-devdll-probe.exe
            okam-stream-probe.exe
