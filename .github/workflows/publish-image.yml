name: Publish native bridge image

on:
  push:
    branches: [main]
    paths:
      - "okam_native_app/**"
      - "src/okam_native/**"
      - "native/android_compat/**"
      - "native/hybris_probe/**"
      - "native/hybris_connect/**"
      - "native/amd64_connect/**"
      - "tools/fetch_official_sdk.py"
      - "docs/vendor-artifacts.json"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Suffix for a test build, e.g. test1. Empty publishes the plain version."
        required: false
        default: ""
      move_latest:
        description: "Also move the latest tag. Ignored unless run from main."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-okam-native
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app.outputs.version }}
      move_latest: ${{ steps.app.outputs.move_latest }}
    steps:
      - uses: actions/checkout@v6
      - name: Read app version
        id: app
        shell: bash
        env:
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
          REQUEST_LATEST: ${{ inputs.move_latest }}
        run: |
          set -eu
          base="$(sed -n 's/^version: //p' okam_native_app/config.yaml)"
          if [ -n "${TAG_SUFFIX:-}" ]; then
            echo "version=${base}-${TAG_SUFFIX}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${base}" >> "$GITHUB_OUTPUT"
          fi
          # latest must only ever follow main. A test build published from a
          # branch must not repoint the tag that installations track.
          if [ "${GITHUB_REF}" = "refs/heads/main" ] \
             && { [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${REQUEST_LATEST:-false}" = "true" ]; }; then
            echo "move_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "move_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: aarch64
            platform: linux/arm64
            docker_arch: arm64
          - ha_arch: amd64
            platform: linux/amd64
            docker_arch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.ha_arch }} app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./okam_native_app/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/oleandor/okam-ha-native:${{ needs.prepare.outputs.version }}-${{ matrix.ha_arch }}
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}
            TARGETARCH=${{ matrix.docker_arch }}
          cache-from: type=gha,scope=${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ha_arch }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        id: manifests
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MOVE_LATEST: ${{ needs.prepare.outputs.move_latest }}
        run: |
          set -eu
          image="ghcr.io/oleandor/okam-ha-native"
          tags=(--tag "$image:$VERSION")
          if [ "$MOVE_LATEST" = "true" ]; then
            tags+=(--tag "$image:latest")
          else
            echo "Leaving :latest untouched; publishing $VERSION only."
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:$VERSION-aarch64" \
            "$image:$VERSION-amd64"
          docker buildx imagetools inspect "$image:$VERSION"
          digest="$(docker buildx imagetools inspect "$image:$VERSION" \
            | sed -n 's/^Digest: *//p' | head -1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Guarded by the same condition as the latest tag, so a test build
      # published from a branch can never create a release.
      - name: Create the GitHub release
        if: needs.prepare.outputs.move_latest == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ steps.manifests.outputs.digest }}
        run: |
          set -eu
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, leaving it untouched."
            exit 0
          fi
          notes="$(awk -v want="## $VERSION" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="See CHANGELOG.md for the changes in this release."
          fi
          image="ghcr.io/oleandor/okam-ha-native"
          {
            printf '%s\n\n' "$notes"
            printf 'Published multi-architecture image: `%s:%s` (`linux/arm64`, `linux/amd64`)\n\n' "$image" "$VERSION"
            printf 'Digest: `%s`\n' "$DIGEST"
          } > release-notes.md
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "O-KAM Native Bridge $VERSION" \
            --notes-file release-notes.md
