name: Publish native bridge image

on:
  push:
    branches: [main]
    paths:
      - "okam_native_app/**"
      - "src/okam_native/**"
      - "native/android_compat/**"
      - "native/hybris_probe/**"
      - "native/hybris_connect/**"
      - "native/amd64_connect/**"
      - "tools/fetch_official_sdk.py"
      - "docs/vendor-artifacts.json"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-okam-native
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Read app version
        id: app
        shell: bash
        run: |
          echo "version=$(sed -n 's/^version: //p' okam_native_app/config.yaml)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: aarch64
            platform: linux/arm64
            docker_arch: arm64
          - ha_arch: amd64
            platform: linux/amd64
            docker_arch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.ha_arch }} app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./okam_native_app/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/oleandor/okam-ha-native:${{ needs.prepare.outputs.version }}-${{ matrix.ha_arch }}
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}
            TARGETARCH=${{ matrix.docker_arch }}
          cache-from: type=gha,scope=${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ha_arch }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          image="ghcr.io/oleandor/okam-ha-native"
          docker buildx imagetools create \
            --tag "$image:$version" \
            --tag "$image:latest" \
            "$image:$version-aarch64" \
            "$image:$version-amd64"
